// Settings for SuMa.Ksp.BatteryCalculator. Every BATTERY_CALCULATOR node found in GameData is applied in load
// order, so a patch elsewhere can change one value without repeating the others.

BATTERY_CALCULATOR
{
	// What a craft is planned for until the player picks something else: a CelestialBody name, or empty
	// for the home planet, and an orbit altitude in kilometres.
	DefaultBody = Kerbin
	DefaultAltitude = 120

	// For a moon, also plan for the pass through its planet's shadow that comes once per orbit of the moon:
	// the Mun spends about 37 minutes behind Kerbin, Laythe about an hour behind Jool. The window has a
	// checkbox for it too; this is where it starts.
	IncludeParentEclipses = True

	// A producer that burns fuel - a fuel cell, a reactor - is only counted by default when the fuel aboard
	// lasts at least this many years, in the game's calendar. Fuel cells fall short, reactors do not.
	FueledProducerMinimumYears = 1

	// Seconds between two recalculations while nothing about the craft changes. Changes to the craft, the crew
	// or the vessel are picked up straight away regardless.
	EditorRefreshInterval = 1
	FlightRefreshInterval = 1
}

// Support for mod modules that is plain data: where the rate is, and what says the module is on. Each node
// only takes effect when its module class is loaded, so nothing here needs its mod to be installed.
//
//   name        the module class; subclasses match too
//   role        Consumer or Producer
//   behaviour   Constant    runs all the time, counted unless 'active' says it is off
//               Continuous  keeps running once started; counted in the editor, in flight while on
//               Switchable  runs once switched on; not counted in the editor, counted in flight while on
//               OnDemand    only while in use; never counted by default
//               Fueled      burns fuel; counted only while the fuel lasts FueledProducerMinimumYears
//               Solar       needs sunlight
//   rate        a field or property holding electric charge per second, or resHandler for the module's
//               RESOURCE nodes
//   rateScale, rateFactor, rateFactorScale
//               rate x rateScale x (rateFactor x rateFactorScale), for modules that store it differently
//   active      a field or property saying the module is on; activeValues lists the values meaning on when it
//               is not simply true or false
//   label, detail
//               what the row is called, and its tooltip

// SCANsat scanners, including the resource scanners built on them: their RESOURCE rate while scanning.
BATTERY_CALCULATOR_MODULE
{
	name = SCANsat
	role = Consumer
	behaviour = Switchable
	rate = resHandler
	active = scanning
	label = Scanner
}

// DMagic Orbital Science instruments that keep running once deployed. The one-off experiments draw only while
// they collect and are listed unticked from their RESOURCE rate without needing a node.
BATTERY_CALCULATOR_MODULE
{
	name = DMAnomalyScanner
	role = Consumer
	behaviour = Switchable
	rate = resHandler
	active = IsDeployed
	label = Anomaly scanner
}

BATTERY_CALCULATOR_MODULE
{
	name = DMBathymetry
	role = Consumer
	behaviour = Switchable
	rate = resHandler
	active = lightsOn
	label = Bathymetry lights
}

BATTERY_CALCULATOR_MODULE
{
	name = DMMagBoomModule
	role = Consumer
	behaviour = Switchable
	rate = resHandler
	label = Magnetometer
	detail = Draws power while the boom is out and recording. Nothing in the module tells the two apart from outside, so tick it if it stays on.
}

BATTERY_CALCULATOR_MODULE
{
	name = DMAsteroidScanner
	role = Consumer
	behaviour = Switchable
	rate = resHandler
	active = IsDeployed
	label = Asteroid scanner
}

// CactEye telescope processors, which draw consumeRate while active and stay active until switched off.
BATTERY_CALCULATOR_MODULE
{
	name = CactEyeProcessor
	role = Consumer
	behaviour = Switchable
	rate = consumeRate
	active = Active
	label = Telescope processor
}

// Wild Blue's KerbalActuators lights and magnets.
BATTERY_CALCULATOR_MODULE
{
	name = WBILightController
	role = Consumer
	behaviour = Switchable
	rate = ecRequired
	active = lightsOn
	label = Lights
}

BATTERY_CALCULATOR_MODULE
{
	name = WBIMagnetController
	role = Consumer
	behaviour = Switchable
	rate = ecPerSec
	active = magnetActivated
	label = Magnet
}

// AT_Utils lights draw EnergyConsumption while open; its animators draw only while moving and are left alone.
BATTERY_CALCULATOR_MODULE
{
	name = MultiLights
	role = Consumer
	behaviour = Switchable
	rate = EnergyConsumption
	active = State
	activeValues = Opened, Opening
	label = Lights
}

// AT_Utils' magnetic damper: its idle draw while enabled, and more on top while it actually damps.
BATTERY_CALCULATOR_MODULE
{
	name = ATMagneticDamper
	role = Consumer
	behaviour = Switchable
	rate = IdleEnergyConsumption
	active = DamperEnabled
	label = Magnetic damper
	detail = Its idle draw; more while it damps a vessel.
}

// KAS winches draw motorPowerDrain only while the motor turns.
BATTERY_CALCULATOR_MODULE
{
	name = KASLinkWinch
	role = Consumer
	behaviour = OnDemand
	rate = motorPowerDrain
	label = Winch
	detail = Only while the winch motor runs.
}

// Konstruction's magnetic docking nodes request powerCost x magPercent every physics frame, fifty times a
// second at normal speed, for as long as the magnet is on.
BATTERY_CALCULATOR_MODULE
{
	name = ModuleMagneticNode
	role = Consumer
	behaviour = Switchable
	rate = powerCost
	rateScale = 50
	rateFactor = magPercent
	active = magnetIsEnabled
	label = Magnet
}

// SystemHeat heat exchangers keep CurrentPowerConsumption as a negative rate.
BATTERY_CALCULATOR_MODULE
{
	name = ModuleSystemHeatExchanger
	role = Consumer
	behaviour = Constant
	rate = CurrentPowerConsumption
	active = Enabled
	label = Heat exchanger
}

// Near Future Electrical capacitors draw ChargeRate while recharging, which the player starts by hand.
BATTERY_CALCULATOR_MODULE
{
	name = DischargeCapacitor
	role = Consumer
	behaviour = OnDemand
	rate = ChargeRate
	label = Capacitor charging
	detail = Only while recharging the capacitor.
}
